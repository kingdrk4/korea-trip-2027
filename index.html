<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>✈️ KOREA TRIP 2027 💗</title>
</head>
<body>
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px;color:#7f2850">正在加载 Korea Trip 2027…</div>
<script>
Promise.all([
  'parts/kt_part_01.txt','parts/kt_part_02.txt','parts/kt_part_03.txt','parts/kt_part_04.txt','parts/kt_part_05.txt','parts/kt_part_06.txt'
].map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok) throw new Error(p+' '+r.status);return r.text()}))).then(parts=>{
  const html=parts.join('');
  const marker='</body>';
  const addons='<script src="parts/v7_upgrade.js?v=2"><\/script><script src="parts/fx_live.js?v=1"><\/script><script src="parts/hero_weather.js?v=2"><\/script><script src="parts/media_upload.js?v=2"><\/script>';
  const upgraded=html.includes(marker)?html.replace(marker,addons+marker):html;
  document.open();document.write(upgraded);document.close();
}).catch(err=>{document.body.innerHTML='<div style="font-family:sans-serif;padding:24px;color:#b00020">加载失败：'+String(err)+'</div>'});
</script>
</body>
</html>
